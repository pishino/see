# Try See without cloning: builds the web app and a browser preview of the phone app, and publishes both to
# GitHub Pages at https://<owner>.github.io/<repo>/ (the phone app at …/phone/).
# One-time setup: Settings › Pages › Build and deployment › Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Web app
        run: npm run build
        env:
          SEE_BASE: /${{ github.event.repository.name }}/
          # app keys for real connections and sign-in (public client ids): Settings › Secrets and variables › Actions › Variables
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_REDDIT_CLIENT_ID: ${{ vars.VITE_REDDIT_CLIENT_ID }}
          VITE_APPLE_MUSIC_TOKEN: ${{ vars.VITE_APPLE_MUSIC_TOKEN }}
          VITE_APPLE_SERVICES_ID: ${{ vars.VITE_APPLE_SERVICES_ID }}
          VITE_DISCORD_APP_ID: ${{ vars.VITE_DISCORD_APP_ID }}
      - name: Phone app, as a web preview
        working-directory: apps/mobile
        run: npx expo export --platform web --output-dir ../web/dist/phone
        env:
          CI: 1
          SEE_PHONE_BASE: /${{ github.event.repository.name }}/phone
      - name: Deep links open the app (GitHub Pages serves 404.html for unknown paths)
        run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
